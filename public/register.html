<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Lilly Memes</title>
    <link rel="stylesheet" href="/css/register.css">
    <link rel="stylesheet" href="/css/brand.css">
</head>

<body class="auth-page register-page">
    <main class="auth-shell">
        <a class="auth-brand" href="/" aria-label="Lilly Memes home">
            <img src="/images/lilly-memes-logo.jpg" class="brand-logo-image" alt="">
            <span>Lilly Memes</span>
        </a>
        <section class="auth-card" aria-labelledby="page-title">
            <header class="auth-heading">
                <p class="auth-eyebrow">Join the fun</p>
                <h1 id="page-title">Create your account</h1>
                <p>Save your favorites and find your people.</p>
            </header>

            <form id="registerForm" class="auth-form">
                <div class="form-field">
                    <label for="fullName">Full name <span class="optional-label">(optional)</span></label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Your full name"
                        autocomplete="name"
                    >
                </div>

                <div class="form-field">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button class="auth-submit" type="submit">Create account</button>
            </form>

            <p id="message" class="auth-message" role="status" aria-live="polite"></p>

            <p class="auth-switch">
                Already have an account?
                <a href="/login.html">Log in</a>
            </p>
        </section>
        <p class="auth-caption">Good memes are better when shared.</p>
    </main>
    <script src="/js/register.js?v=register-to-plans"></script>
</body>

</html>
