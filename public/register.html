<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - Lilly Memes</title>

</head>

<body>

    <h1>😂 Lilly Memes</h1>

    <h2>Create Account</h2>

    <form id="registerForm">

        <div>
            <label>Full Name</label>

            <input
                type="text"
                id="fullName"
                placeholder="Your full name"
            >
        </div>

        <br>

        <div>
            <label>Username</label>

            <input
                type="text"
                id="username"
                placeholder="Choose a username"
                required
            >
        </div>

        <br>

        <div>
            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Your email"
                required
            >
        </div>

        <br>

        <div>
            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >
        </div>

        <br>

        <button type="submit">
            Create Account
        </button>

    </form>

    <p id="message"></p>

    <p>
        Already have an account?
        <a href="/login.html">Login</a>
    </p>


    <script src="/js/register.js"></script>

</body>

</html>
