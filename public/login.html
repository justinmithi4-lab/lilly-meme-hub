<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Lilly Memes</title>

</head>

<body>

    <h1>😂 Lilly Memes</h1>

    <h2>Login</h2>


    <form id="loginForm">

        <div>

            <label>
                Username or Email
            </label>

            <input
                type="text"
                id="login"
                placeholder="Username or email"
                required
            >

        </div>

        <br>

        <div>

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Your password"
                required
            >

        </div>

        <br>

        <button type="submit">
            Login
        </button>

    </form>


    <p id="message"></p>


    <p>
        Don't have an account?
        <a href="/register.html">
            Create one
        </a>
    </p>


    <script src="/js/login.js"></script>

</body>

</html>
