<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard - Lilly Memes</title>

    <link
        rel="stylesheet"
        href="/css/admin.css"
    >

</head>

<body>

    <header class="admin-header">

        <div class="brand">
            😂 Lilly Memes
        </div>

        <div class="admin-user">

            <span id="adminName">
                Administrator
            </span>

            <button id="logoutButton">
                Logout
            </button>

        </div>

    </header>


    <main class="admin-container">

        <section class="welcome-section">

            <h1>
                Admin Dashboard
            </h1>

            <p>
                Manage Lilly Memes from one place.
            </p>

        </section>


        <section class="dashboard-grid">

            <div class="dashboard-card">

                <span class="card-icon">
                    👥
                </span>

                <h3>
                    Members
                </h3>

                <strong id="memberCount">
                    0
                </strong>

            </div>


            <div class="dashboard-card">

                <span class="card-icon">
                    💳
                </span>

                <h3>
                    Payments
                </h3>

                <strong id="paymentCount">
                    0
                </strong>

            </div>


            <div class="dashboard-card">

                <span class="card-icon">
                    😂
                </span>

                <h3>
                    Memes
                </h3>

                <strong id="memeCount">
                    0
                </strong>

            </div>


            <div class="dashboard-card">

                <span class="card-icon">
                    📖
                </span>

                <h3>
                    Stories
                </h3>

                <strong id="storyCount">
                    0
                </strong>

            </div>

        </section>


        <section class="admin-actions">

            <h2>
                Management
            </h2>

            <div class="action-grid">

                <button>
                    
                    👥 Manage Members
                </button>

                <button>
                    💳 Manage Payments
                </button>

                <button
                type="button"
                 onclick="window.location.href='/admin-memes.html'">
                    😂 Manage Memes
                </button>

                <button>
                    📂 Manage Categories
                </button>

                <button>
                    📖 Manage Stories
                </button>

                <button>
                    💬 Manage Comments
                </button>

                <button>
                    🚩 Reports
                </button>

                <button>
                    ⚙️ Site Settings
                </button>

            </div>

        </section>

    </main>


    <script src="/js/admin.js"></script>

</body>

</html>
